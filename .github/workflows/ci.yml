name: Advanced MLOps CI Pipeline

# Professional CI workflow tailored for Dicoding advanced rubric
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mlops-advanced-ci:
    name: Advanced MLOps CI (MLflow + Docker Hub)
    runs-on: ubuntu-latest

    env:
      # Docker repository target
      DOCKER_REPO: xebec51/heart-disease-model

    steps:
      # -----------------------------------------------------
      # 1) Checkout repository
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # -----------------------------------------------------
      # 2) Setup Python 3.12.7 and enable pip cache
      # -----------------------------------------------------
      - name: Setup Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
          cache: 'pip'

      # Optional: explicit pip cache restore (speeds up installs)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # -----------------------------------------------------
      # 3) Check environment (sanity checks)
      # -----------------------------------------------------
      - name: Check environment
        run: |
          echo "== Environment check =="
          python --version
          pip --version
          which python
          pwd
          ls -la

      # -----------------------------------------------------
      # 4) Install core Python dependencies
      #    (mlflow and essential libs required for training)
      # -----------------------------------------------------
      - name: Install core dependencies
        run: |
          echo "== Installing core Python packages =="
          python -m pip install --upgrade pip
          pip install --upgrade pip setuptools wheel
          pip install mlflow==2.19.0 scikit-learn pandas

      # -----------------------------------------------------
      # 5) (Optional) Install project-specific requirements
      #    If a requirements.txt is present, install it.
      # -----------------------------------------------------
      - name: Install project requirements (if present)
        if: ${{ exists('requirements.txt') }}
        run: |
          echo "== Installing requirements.txt =="
          pip install -r requirements.txt

      # -----------------------------------------------------
      # 6) Run MLflow Project (train model)
      #    This step must fail the job if training fails.
      # -----------------------------------------------------
      - name: Run MLflow Project (training)
        id: run_mlflow
        run: |
          echo "== Running MLflow Project =="
          # Run the MLProject directory using local env manager
          mlflow run MLProject --env-manager local

      # -----------------------------------------------------
      # 7) Get latest MLflow Run ID (from local mlruns)
      #    Save it as a step output `run_id` for later steps.
      # -----------------------------------------------------
      - name: Get latest MLflow run id
        id: get_run
        run: |
          echo "== Locating latest MLflow run id =="
          python - <<'PY'
import mlflow
import os
exp = mlflow.get_experiment_by_name('Default')
if exp is None:
    # fallback to experiment id 0
    exp = mlflow.get_experiment(0)
runs = mlflow.search_runs([exp.experiment_id], order_by=['attributes.start_time DESC'], max_results=1)
if runs.empty:
    raise SystemExit('No MLflow runs found')
run_id = runs.loc[0,'run_id']
print('Found run_id:', run_id)
print(f"run_id={run_id}")
open(os.environ['GITHUB_OUTPUT'],'a').write(f"run_id={run_id}\n")
PY

      # -----------------------------------------------------
      # 8) Upload MLflow artifacts (store in workflow artifacts)
      # -----------------------------------------------------
      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v3
        with:
          name: mlflow-artifacts
          path: mlruns/**
          retention-days: 7

      # -----------------------------------------------------
      # 9) Build Docker image from MLflow model
      #    Uses the `runs:/<run_id>/model` URI to build image.
      # -----------------------------------------------------
      - name: Build Docker image from MLflow model
        env:
          RUN_ID: ${{ steps.get_run.outputs.run_id }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          set -e
          echo "== Building Docker image from MLflow model (run: $RUN_ID) =="
          # Use stable runs:/ URI which points to the model artifact path
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "${{ env.DOCKER_REPO }}:${IMAGE_TAG}"

      # -----------------------------------------------------
      # 10) Login to Docker Hub using secrets
      # -----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------------------------------
      # 11) Push Docker image to Docker Hub (tagged)
      # -----------------------------------------------------
      - name: Push Docker image to Docker Hub
        env:
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          echo "== Tagging & Pushing Docker image =="
          docker push "${{ env.DOCKER_REPO }}:${IMAGE_TAG}"
          echo "== Also update :latest tag =="
          docker tag "${{ env.DOCKER_REPO }}:${IMAGE_TAG}" "${{ env.DOCKER_REPO }}:latest"
          docker push "${{ env.DOCKER_REPO }}:latest"

      # -----------------------------------------------------
      # 12) Final status and logs
      # -----------------------------------------------------
      - name: Post pipeline status
        run: |
          echo "========================================================"
          echo "PIPELINE: SUCCESS"
          echo "MLflow run id: ${{ steps.get_run.outputs.run_id }}"
          echo "Docker images pushed: ${{ env.DOCKER_REPO }}:${{ github.run_number }} and ${{ env.DOCKER_REPO }}:latest"
          echo "========================================================"